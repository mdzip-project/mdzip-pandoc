name: Test action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Make a note with an image
        shell: bash
        run: |
          mkdir -p work/img
          # A 1x1 PNG.
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==' | base64 -d > work/img/dot.png
          printf '# Test note\n\nSome text.\n\n![A dot](img/dot.png)\n' > work/note.md

      - name: Package .md as .mdz
        id: pack
        uses: ./
        with:
          input: work/note.md
          output: out/note.mdz
          args: --resource-path=work

      - name: Convert .mdz to HTML
        id: html
        uses: ./
        with:
          input: ${{ steps.pack.outputs.output }}
          output: out/site/note.html
          args: --standalone --embed-resources

      - name: Check the results
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.html.outputs.output }}" = out/site/note.html
          unzip -l out/note.mdz > list.txt
          cat list.txt
          grep -q 'images/dot.png' list.txt
          grep -q 'Test note' out/site/note.html
          grep -q 'data:image/png;base64' out/site/note.html
          echo "OK"

      - name: Make a second page that links to the first
        shell: bash
        run: |
          mkdir -p work/site-src/docs
          cp out/note.mdz work/site-src/note.mdz
          printf '# Home

See [the note](note.mdz) and [setup](docs/setup.mdz#install).
' > work/home.md
          printf '# Setup

## Install

Back [home](../index.mdz).
' > work/setup.md

      - name: Package them
        uses: ./
        with:
          input: work/home.md
          output: work/site-src/index.mdz

      - name: Package the page in a subfolder
        uses: ./
        with:
          input: work/setup.md
          output: work/site-src/docs/setup.mdz

      - name: Convert a folder
        id: folder
        uses: ./
        with:
          input: work/site-src
          output: out/web
          args: --standalone --embed-resources

      - name: Check the folder
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.folder.outputs.output }}" = out/web
          ls -R out/web
          test -f out/web/note.html
          test -f out/web/docs/setup.html
          grep -q 'href="note.html"' out/web/index.html
          grep -q 'href="docs/setup.html#install"' out/web/index.html
          grep -q 'href="../index.html"' out/web/docs/setup.html
          grep -q 'data:image/png;base64' out/web/note.html
          echo "OK"

      - name: Convert a folder to Word
        uses: ./
        with:
          input: work/site-src
          output: out/word
          extension: docx

      - name: Check Word output keeps .mdz links
        shell: bash
        run: |
          test -f out/word/docs/setup.docx
          unzip -p out/word/index.docx word/_rels/document.xml.rels | grep -q 'note.mdz'

      - name: Second run reuses Pandoc and mdzip-core-lua
        uses: ./
        with:
          input: out/note.mdz
          output: out/note.docx

  errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: printf '# x\n' > plain.md
      - name: Neither file is .mdz
        id: neither
        continue-on-error: true
        uses: ./
        with:
          input: plain.md
          output: plain.html
      - name: Missing input
        id: missing
        continue-on-error: true
        uses: ./
        with:
          input: nope.mdz
          output: nope.html
      - name: Folder with no .mdz
        id: empty
        continue-on-error: true
        uses: ./
        with:
          input: .github
          output: out
      - name: All should have failed
        run: |
          test "${{ steps.empty.outcome }}" = failure
          test "${{ steps.neither.outcome }}" = failure
          test "${{ steps.missing.outcome }}" = failure
