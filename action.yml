name: MDZip Pandoc
description: Convert MDZip (.mdz) files with Pandoc, images included, to HTML, Word, EPUB, PDF and more, or package documents as .mdz.
author: MDZip project
branding:
  icon: file-text
  color: gray-dark

inputs:
  input:
    description: >
      The file to convert, such as docs/guide.mdz (or a .md/.docx to package
      as .mdz). Or a folder: every .mdz in it, and in its subfolders, is
      converted.
    required: true
  output:
    description: >
      The file to write. Its extension picks the format (.html, .docx, .epub,
      .pdf, ... or .mdz); missing folders are created. When input is a folder,
      the folder to write to, keeping the subfolders.
    required: true
  extension:
    description: When input is a folder, the format each .mdz is converted to, as a file extension.
    required: false
    default: html
  site-url:
    description: >
      The address the converted folder is published at, such as
      https://example.org/ or https://you.github.io/repo/. When set, with a
      folder converted to html, the action writes sitemap.xml and robots.txt,
      and gives each page "page-url" (its full address, for a canonical link)
      and "site-url" for its template.
    required: false
    default: ""
  images:
    description: >
      For HTML made from an .mdz: "files" (the default) writes each picture
      once to an images folder, named by its contents, and points the pages
      at it; "embed" leaves pictures to Pandoc (use --embed-resources to build
      them into each page).
    required: false
    default: files
  args:
    description: >
      Extra Pandoc options, such as "--standalone --embed-resources" for one
      self-contained HTML file, or "--toc".
    required: false
    default: ""
  pandoc-version:
    description: Pandoc version to install (3.0 or later). Leave empty to use a Pandoc that's already on PATH, or install the tested version if there isn't one.
    required: false
    default: ""
  core-lua-version:
    description: mdzip-core-lua release that mdz.lua reads and writes archives with.
    required: false
    default: v0.1.0

outputs:
  output:
    description: The path of the file (or folder) that was written.
    value: ${{ steps.convert.outputs.output }}

runs:
  using: composite
  steps:
    - name: Check for Pandoc
      id: pandoc
      shell: bash
      env:
        WANTED: ${{ inputs.pandoc-version }}
      run: |
        if [ -z "$WANTED" ] && command -v pandoc >/dev/null; then
          echo "install=false" >> "$GITHUB_OUTPUT"
          echo "Using $(pandoc --version | head -1)"
        else
          echo "install=true" >> "$GITHUB_OUTPUT"
          echo "version=${WANTED:-3.13}" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Pandoc
      if: steps.pandoc.outputs.install == 'true'
      uses: pandoc/actions/setup@v1
      with:
        version: ${{ steps.pandoc.outputs.version }}

    - name: Get mdzip-core-lua
      shell: bash
      env:
        CORE_LUA: ${{ inputs.core-lua-version }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/mdzip-core-lua-$CORE_LUA"
        [ "$RUNNER_OS" = Windows ] && dir=$(cygpath -u "$dir")
        if [ ! -d "$dir/src/mdzip" ]; then
          mkdir -p "$dir"
          curl -fsSL --retry 3 "https://codeload.github.com/mdzip-project/mdzip-core-lua/tar.gz/refs/tags/$CORE_LUA" \
            | tar -xz -C "$dir" --strip-components=1 \
            || { echo "::error title=mdzip-pandoc::couldn't download mdzip-core-lua $CORE_LUA"; exit 1; }
        fi
        src="$dir/src"
        [ "$RUNNER_OS" = Windows ] && src=$(cygpath -w "$src")
        echo "MDZIP_LUA_PATH=$src" >> "$GITHUB_ENV"

    - name: Convert
      id: convert
      shell: bash
      env:
        INPUT: ${{ inputs.input }}
        OUTPUT: ${{ inputs.output }}
        EXTENSION: ${{ inputs.extension }}
        SITE_URL: ${{ inputs.site-url }}
        IMAGES: ${{ inputs.images }}
        ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        # Plain sh only: macOS runners have bash 3.2 (no ${x,,}, empty arrays trip set -u).
        fail() { echo "::error title=mdzip-pandoc::$1"; exit 1; }
        native() { if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$1"; else printf %s "$1"; fi; }
        lower() { printf %s "$1" | tr '[:upper:]' '[:lower:]'; }
        lua=$(native "$GITHUB_ACTION_PATH/mdz.lua")
        links=$(native "$GITHUB_ACTION_PATH/mdz-links.lua")
        images=$(native "$GITHUB_ACTION_PATH/mdz-images.lua")

        site=""
        [ -z "$SITE_URL" ] || site="${SITE_URL%/}/"
        xml() { printf %s "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

        case "$IMAGES" in files|embed) ;; *) fail "images must be files or embed, not '$IMAGES'" ;; esac

        # Read with mdz.lua when the input is an .mdz (and turn links to other
        # .mdz files into links to their pages), write with it when the output is.
        # The third argument, if any, is the page's address; the fourth, how the
        # page refers to the shared images folder (when a folder is converted).
        convert() {
          local in=$1 out=$2 url=${3:-} pics=${4:-images/}
          set --
          case "$(lower "$in")" in *.mdz) set -- "$@" -f "$lua" --lua-filter "$links" ;; esac
          case "$(lower "$out")" in *.mdz) set -- "$@" -t "$lua" ;; esac
          [ $# -gt 0 ] || fail "input or output must be an .mdz file"
          # HTML from an .mdz: pictures become files in images/, named by their contents.
          if [ "$IMAGES" = files ]; then
            case "$(lower "$in"):$(lower "$out")" in
              *.mdz:*.html|*.mdz:*.htm) set -- "$@" --lua-filter "$images" ;;
            esac
          fi
          [ -z "$site" ] || set -- "$@" -M "site-url=$site"
          [ -z "$url" ] || set -- "$@" -M "page-url=$url"
          mkdir -p "$(dirname "$out")"
          # ARGS is split on spaces on purpose: it holds several options.
          # shellcheck disable=SC2086
          MDZ_IMAGES_URL="$pics" pandoc "$@" "$in" -o "$out" $ARGS
          echo "Wrote $out"
        }

        if [ -d "$INPUT" ]; then
          input=${INPUT%/}; output=${OUTPUT%/}; ext=${EXTENSION#.}
          [ ! -e "$output" ] || [ -d "$output" ] || fail "input is a folder, so output '$OUTPUT' must be a folder too"
          [ "$(lower "$ext")" != mdz ] || fail "extension can't be mdz: the input files already are"
          # Every page shares one images folder at the top of the output.
          mkdir -p "$output"
          MDZ_IMAGES_DIR=$(native "$output/images"); export MDZ_IMAGES_DIR
          web=false
          [ -n "$site" ] && [ "$(lower "$ext")" = html ] && web=true
          urls="${RUNNER_TEMP:-/tmp}/mdzip-pandoc-urls.txt"
          : > "$urls"
          count=0
          while IFS= read -r file; do
            rel=${file#"$input"/}
            page="${rel%.*}.$ext"
            url=""
            if $web; then
              case "$page" in
                404.html) ;;                                  # GitHub Pages' "not found" page
                index.html) url=$site ;;
                */index.html) url="$site${page%index.html}" ;;
                *) url="$site$page" ;;
              esac
              if [ -n "$url" ]; then
                # Last changed: the page's last commit, when there's git history.
                date=$(git log -1 --format=%cs -- "$file" 2>/dev/null || true)
                printf '%s\t%s\n' "$url" "$date" >> "$urls"
              fi
            fi
            # From docs/setup.html, the images folder is ../images/.
            slashes=${page//[^\/]/}
            pics=images/
            i=0; while [ "$i" -lt "${#slashes}" ]; do pics="../$pics"; i=$((i + 1)); done
            convert "$file" "$output/$page" "$url" "$pics"
            count=$((count + 1))
          done < <(find "$input" -type f \( -name '*.mdz' -o -name '*.MDZ' \) | sort)
          [ "$count" -gt 0 ] || fail "no .mdz files in '$INPUT'"
          [ "$count" -eq 1 ] && echo "Converted 1 file" || echo "Converted $count files"
          if $web; then
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
              while IFS="$(printf '\t')" read -r url date; do
                if [ -n "$date" ]; then
                  echo "  <url><loc>$(xml "$url")</loc><lastmod>$date</lastmod></url>"
                else
                  echo "  <url><loc>$(xml "$url")</loc></url>"
                fi
              done < "$urls"
              echo '</urlset>'
            } > "$output/sitemap.xml"
            printf 'User-agent: *\nAllow: /\n\nSitemap: %ssitemap.xml\n' "$site" > "$output/robots.txt"
            echo "Wrote $output/sitemap.xml and $output/robots.txt"
          fi
        else
          [ -f "$INPUT" ] || fail "input '$INPUT' not found"
          convert "$INPUT" "$OUTPUT"
        fi
        echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"
